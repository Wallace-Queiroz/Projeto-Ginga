<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Projeto Ginga</title>

        <link rel="stylesheet" href="css/cadastros.css">

    </head>

    <body>
        <div class="menu">
            <a class="font-menu" href="index.html">Ginga</a>
            <a class="font-menu" href="projetos.html">Projetos</a>
            <a class="font-menu" href="cadastroDoador.html">Cadastro de Doadores</a>
            <a class="font-menu" href="cadastroVoluntario.html">Cadastro de Voluntários</a>
        </div>

        <div class="form-container">
            <h2>Cadastro de Voluntário</h2>
            <p class="subtitle">Preencha todos os campos.</p>
            
            <hr>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nome">Nome:</label><br>
                    <input type="text" id="nome" placeholder="Nome completo" required><br>
                
                    <label for="cpf">CPF:</label><br>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required><br>
                
                    <label for="dataNascimento">Data de Nascimento:</label><br>
                    <input type="date" id="dataNascimento" required><br>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone:</label><br>
                    <input type="tel" id="telefone" placeholder="(99) 99999-9999" required><br>
                
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" placeholder="E-mail Válido." required><br>
                </div>

                <div class="form-group">
                    <label for="rua">Rua:</label><br>
                    <input type="text" id="rua" placeholder="Nome da rua" required><br>
                
                    <label for="numero">Número:</label><br>
                    <input type="number" id="numero" placeholder="Número"><br>
                
                    <label for="bairro">Bairro:</label><br>
                    <input type="text" id="bairro" placeholder="Nome do bairro" required><br>
                
                    <label for="cidade">Cidade:</label><br>
                    <input type="text" id="cidade" placeholder="Nome da cidade" required><br>
                
                    <label for="uf">UF:</label><br>
                    <input type="text" id="uf" placeholder="SP" required><br>
                </div>

                <div class="form-group">
                    <label for="assunto">Projeto:</label><br>
                    <select id="assunto">
                        <option value="" disabled selected></option>
                        <option value="patinacao">Patinação</option>
                        <option value="musica_danca">Música & Dança</option>
                        <option value="tecnologia_desenvolvimento">Tecnologia & Desenvolvimento</option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="mensagem">Fale um pouco sobre você :</label>
                    <textarea id="mensagem" placeholder="Sua mensagem"></textarea>
                </div>

                <div class="form-group btn-group">
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </div>

    </body>

</html>
